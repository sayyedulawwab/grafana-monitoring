# Grafana monitoring stack - production (Ubuntu VM <monitoring-vm>)
#
# Only two host ports are published:
#   14318 -> OTLP HTTP  (from Windows Server <app-server>)
#   3000  -> Grafana    (from desktop / LAN)
# Loki, Prometheus and Tempo stay on the Docker network only.
#
# Image tags and Grafana credentials come from .env, written by the release
# pipeline on the host. See .env.example for the shape.

name: monitoring

networks:
  grafana-monitoring:
    driver: bridge

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION}
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "14318:4318" # OTLP HTTP in
    volumes:
      - ./otel/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - loki
      - tempo
    networks:
      - grafana-monitoring

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    user: "10001:10001"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - ./loki/data:/loki/data
    networks:
      - grafana-monitoring

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus/data"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--enable-feature=exemplar-storage"
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus/data
    networks:
      - grafana-monitoring

  tempo:
    image: grafana/tempo:${TEMPO_VERSION}
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    user: "10001:10001"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - ./tempo/data:/var/tempo
    networks:
      - grafana-monitoring

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    user: "472:472"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # NOTE: /var/lib/grafana, not /var/lib/grafana/data - grafana.db lives at
      # the top of that directory. Mounting one level too deep silently loses
      # users and dashboards on every restart.
      - ./grafana/data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://<monitoring-vm>:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    depends_on:
      - loki
      - prometheus
      - tempo
    networks:
      - grafana-monitoring
