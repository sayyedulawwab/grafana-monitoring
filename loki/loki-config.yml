# Loki - single binary, filesystem storage, OTLP ingestion enabled
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki/data
  ring:
    instance_addr: 0.0.0.0
    kvstore:
      store: inmemory
  replication_factor: 1

limits_config:
  allow_structured_metadata: true   # required for OTLP trace_id / span_id
  volume_enabled: true
  retention_period: 30d
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  reject_old_samples: true
  reject_old_samples_max_age: 168h

schema_config:
  configs:
    - from: 2020-05-15
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/data/index
    cache_location: /loki/data/index_cache
  filesystem:
    directory: /loki/data/chunks

pattern_ingester:
  enabled: true

compactor:
  working_directory: /loki/data/retention
  retention_enabled: true
  delete_request_store: filesystem